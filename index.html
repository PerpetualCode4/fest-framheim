<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fest i Framheim</title>
<meta name="description" content="Fest i Framheim, Fossøyane i Jostedalen. Påmelding på SMS til 484 98 627.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ed;--fg:#1d1c1a;--mut:#6b6760;--line:#d8d2c6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 Inter,system-ui,sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:48px 16px}
main{max-width:460px;width:100%;text-align:center}
small{display:block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
h1{font:600 clamp(44px,11vw,64px)/1.05 "Cormorant Garamond",Georgia,serif;margin:16px 0 8px}
.sted{color:var(--mut)}
dl{margin:40px 0;border-top:1px solid var(--line)}
dl div{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mut)}
dd{font-weight:500}
p{color:var(--mut)}
a.num{display:block;margin-top:6px;font:600 36px/1.2 "Cormorant Garamond",Georgia,serif;
  color:var(--fg);text-decoration:none}
a.num:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <small>Invitasjon</small>
  <h1>Fest i Framheim</h1>
  <div class="sted">Fossøyane, Jostedalen</div>

  <dl>
    <div><dt>Dato</dt><dd>Kjem</dd></div>
    <div><dt>Tid</dt><dd>Kjem</dd></div>
    <div><dt>Stad</dt><dd>Framheim</dd></div>
    <div><dt>Pris</dt><dd>Gratis</dd></div>
  </dl>

  <p>Påmelding på SMS med namn til</p>
  <a class="num" href="sms:+4748498627">484 98 627</a>
</main>
</body>
</html>
